server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Larger header buffers: avoids "400 Request Header Or Cookie Too Large"
    # when the browser sends big/accumulated cookies for localhost
    large_client_header_buffers 4 32k;
    client_header_buffer_size   32k;

    # gzip compression for text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml;

    # Long-lived cache for fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached (always fetch latest build)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
